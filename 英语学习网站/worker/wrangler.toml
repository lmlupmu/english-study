name = "englishmind-worker"
main = "src/index.ts"
compatibility_date = "2024-07-01"

# 创建 D1 数据库后，把 database_id 替换为实际值
[[d1_databases]]
binding = "DB"
database_name = "englishmind-db"
database_id = "b25dc69c-76e5-4d89-b496-b3a97885a254"

# 用于 JWT 签名，部署前通过 wrangler secret put JWT_SECRET 设置
[vars]
# CORS 允许来源。* 表示允许任何前端域名（本地调试 + 生产共用）
ALLOWED_ORIGIN = "*"
